<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGirls - Desafio da Tecnologia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #game {
            max-width: 700px;
            width: 100%;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #764ba2;
            font-size: 2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .question {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 15px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
        }

        .options {
            list-style-type: none;
            padding: 0;
            margin: 20px 0;
        }

        .options li {
            margin: 12px 0;
        }

        .option-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .option-btn.disabled-btn {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .incorrect {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        #nextButton {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: none;
        }

        #nextButton:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #score {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }

        .feedback {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-wrong {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .progress {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            #game {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .question {
                font-size: 1em;
            }
            
            .option-btn {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div id="game">
    <h1>
        🚀 TechGirls Challenge 💻
    </h1>
    <div class="subtitle">Descubra o mundo da tecnologia de forma divertida!</div>
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <ul class="options" id="options"></ul>
    <div class="button-container">
        <button id="nextButton">✨ Próxima Questão ✨</button>
    </div>
    <div id="score"></div>
    <div id="feedback" class="feedback"></div>
</div>

<script>
    const questions = [
        {
            question: "🧠 O que é um ALGORITMO?",
            options: [
                "Uma receita de bolo passo a passo", 
                "Um tipo de vírus de computador", 
                "Uma linguagem de programação específica", 
                "Uma ferramenta de desenho"
            ],
            answer: 0,
            explanation: "✅ Um algoritmo é como uma receita: uma sequência de passos para resolver um problema!"
        },
        {
            question: "🌐 Qual linguagem é a MAIS usada para dar vida a sites interativos?",
            options: ["Python", "JavaScript", "C++", "Ruby"],
            answer: 1,
            explanation: "✅ JavaScript é a linguagem que faz os sites ficarem dinâmicos e interativos!"
        },
        {
            question: "🤖 O que é Inteligência Artificial (IA) na prática?",
            options: [
                "Robôs que dominam o mundo", 
                "Máquinas que aprendem com dados", 
                "Apenas um filme de ficção", 
                "Um novo tipo de celular"
            ],
            answer: 1,
            explanation: "✅ IA são sistemas que aprendem com exemplos e dados para tomar decisões!"
        },
        {
            question: "🔒 Qual é a PRINCIPAL função da Segurança da Informação?",
            options: [
                "Armazenar muitos dados", 
                "Proteger dados contra ameaças", 
                "Criar aplicativos bonitos", 
                "Desenvolver jogos"
            ],
            answer: 1,
            explanation: "✅ Segurança da Informação protege nossos dados de hackers e ameaças digitais!"
        },
        {
            question: "💡 O que é PENSAMENTO COMPUTACIONAL?",
            options: [
                "Pensar como um computador", 
                "Resolver problemas de forma organizada", 
                "Programar sem computador", 
                "Jogar no computador"
            ],
            answer: 1,
            explanation: "✅ Pensamento computacional é uma forma de resolver problemas quebrando em partes menores!"
        },
        {
            question: "🛡️ O que é um 'phishing' na segurança digital?",
            options: [
                "Um tipo de peixe", 
                "Golpe para roubar senhas", 
                "Um antivírus famoso", 
                "Uma senha segura"
            ],
            answer: 1,
            explanation: "⚠️ Phishing é um golpe que tenta enganar você para roubar seus dados pessoais!"
        },
        {
            question: "🎨 Para que serve o CSS no desenvolvimento web?",
            options: [
                "Criar lógica do site", 
                "Deixar o site bonito e estilizado", 
                "Guardar dados do usuário", 
                "Fazer cálculos"
            ],
            answer: 1,
            explanation: "✅ CSS é o 'estilista' dos sites: define cores, fontes e layout!"
        },
        {
            question: "📱 O que significa 'Machine Learning'?",
            options: [
                "Máquinas que quebram", 
                "Aprendizado de máquina", 
                "Linguagem de programação", 
                "Jogos online"
            ],
            answer: 1,
            explanation: "✅ Machine Learning é quando computadores aprendem com exemplos para fazer previsões!"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let selectedOptionIndex = null;

    function displayQuestion() {
        const question = questions[currentQuestionIndex];
        document.getElementById("question").innerHTML = question.question;
        document.getElementById("progress").innerHTML = `Pergunta ${currentQuestionIndex + 1} de ${questions.length}`;
        
        const optionsList = document.getElementById("options");
        optionsList.innerHTML = "";
        
        question.options.forEach((option, index) => {
            const li = document.createElement("li");
            const button = document.createElement("button");
            button.innerHTML = option;
            button.className = "option-btn";
            button.onclick = () => checkAnswer(index);
            li.appendChild(button);
            optionsList.appendChild(li);
        });

        document.getElementById("nextButton").style.display = "none";
        document.getElementById("feedback").innerHTML = "";
        answered = false;
        selectedOptionIndex = null;
        
        // Atualiza pontuação
        document.getElementById("score").innerHTML = `🏆 Pontuação: ${score} 🏆`;
        
        // Habilita todos os botões
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('correct', 'incorrect', 'disabled-btn');
        });
    }

    function checkAnswer(selectedIndex) {
        if (answered) {
            document.getElementById("feedback").innerHTML = "⏰ Você já respondeu esta pergunta! Clique em 'Próxima Questão' para continuar.";
            document.getElementById("feedback").className = "feedback feedback-wrong";
            return;
        }

        const question = questions[currentQuestionIndex];
        const isCorrect = (selectedIndex === question.answer);
        
        // Marcar como respondida
        answered = true;
        selectedOptionIndex = selectedIndex;
        
        // Desabilitar todos os botões de opção
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach((btn, idx) => {
            btn.disabled = true;
            btn.classList.add('disabled-btn');
            
            // Destacar resposta correta e errada
            if (idx === question.answer) {
                btn.classList.add('correct');
            }
            if (idx === selectedIndex && idx !== question.answer) {
                btn.classList.add('incorrect');
            }
        });
        
        // Mostrar feedback e atualizar pontuação
        if (isCorrect) {
            score++;
            document.getElementById("score").innerHTML = `🏆 Pontuação: ${score} 🏆`;
            document.getElementById("feedback").innerHTML = `🎉 CORRETA! 🎉<br>${question.explanation}`;
            document.getElementById("feedback").className = "feedback feedback-correct";
        } else {
            const correctAnswer = question.options[question.answer];
            document.getElementById("feedback").innerHTML = `❌ ERRADA! ❌<br>A resposta correta é: ${correctAnswer}<br><br>${question.explanation}`;
            document.getElementById("feedback").className = "feedback feedback-wrong";
        }
        
        // Mostrar botão próximo
        document.getElementById("nextButton").style.display = "block";
    }

    document.getElementById("nextButton").addEventListener("click", () => {
        if (!answered) {
            document.getElementById("feedback").innerHTML = "⚠️ Por favor, responda a pergunta atual antes de continuar! ⚠️";
            document.getElementById("feedback").className = "feedback feedback-wrong";
            return;
        }
        
        currentQuestionIndex++;
        
        if (currentQuestionIndex < questions.length) {
            displayQuestion();
        } else {
            // Fim do jogo
            const totalQuestions = questions.length;
            const percentage = (score / totalQuestions) * 100;
            let message = "";
            let emoji = "";
            
            if (percentage === 100) {
                message = "PERFEITA! 🌟 Você é uma verdadeira TechGirl!";
                emoji = "🏆👑";
            } else if (percentage >= 70) {
                message = "MUITO BOM! 🎉 Você está no caminho certo!";
                emoji = "⭐💪";
            } else if (percentage >= 50) {
                message = "BOM TRABALHO! 📚 Continue aprendendo!";
                emoji = "📖✨";
            } else {
                message = "Continue praticando! 🚀 A tecnologia te espera!";
                emoji = "💪🌈";
            }
            
            const finalMessage = `🎮 FIM DO JOGO! 🎮\n\n${emoji}\n${message}\n\nVocê acertou ${score} de ${totalQuestions} perguntas!\nPorcentagem: ${percentage}%\n\nClique em OK para jogar novamente!`;
            
            alert(finalMessage);
            
            // Reiniciar jogo
            currentQuestionIndex = 0;
            score = 0;
            answered = false;
            displayQuestion();
        }
    });

    // Iniciar o jogo
    displayQuestion();
</script>

</body>
</html>
